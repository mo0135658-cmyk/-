<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث البيانات</title>
    <link rel="stylesheet" href="it.css">
</head>
<body>

    <div id="form-container" class="container">
        <h2>تحديث البيانات</h2>
        
        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" placeholder="ادخل الاسم">
        </div>

        <div class="input-group">
            <label>الفرقة الدراسية</label>
            <input type="text" placeholder="الفرقة">
        </div>

        <div class="input-group">
            <label>التخصص / الشعبة</label>
            <input type="text" placeholder="الشعبة">
        </div>

        <button id="update-btn" onclick="updateData()">تحديث البيانات الآن</button>
    </div>

    <div id="success-card" class="container" style="display: none;">
        <span class="check-icon">✨</span>
        <h3 class="success-title">تمت العملية بنجاح!</h3>
        <p class="success-text">شكراً لك، تم استلام بياناتك وتحديثها بنجاح.</p>
        <button id="update-btn" class="back-btn" onclick="location.reload()">عودة</button>
    </div>

    <script>
        function updateData() {
            const form = document.getElementById('form-container');
            form.style.opacity = '0';
            form.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                form.style.display = 'none';
                const successCard = document.getElementById('success-card');
                successCard.style.display = 'block';
            }, 400);
        }
    </script>

</body>
</html>
